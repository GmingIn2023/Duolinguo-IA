name: Content freshness
on:
  schedule:
    - cron: "17 7 * * 1" # every Monday morning
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --no-warnings scripts/content-check.mts
